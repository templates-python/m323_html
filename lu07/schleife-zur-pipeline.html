<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LU07d – Von der Schleife zur Pipeline</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1f2328; --muted:#5b6670; --line:#d8dee4;
    --panel:#f6f8fa; --hl:#fff3c4; --hl-border:#e5b800;
    --accent:#0b62c4; --accent-soft:#e7f0fb;
    --keep:#0a7d55; --keep-soft:#e4f5ee;
    --drop:#b3541e; --drop-soft:#fbeee4;
    --arrow:#0b62c4;
    --console-bg:#20262c; --console-fg:#e6edf3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151a1f; --fg:#e6edf3; --muted:#9aa7b2; --line:#30373d;
      --panel:#1c2229; --hl:#3d3413; --hl-border:#b79600;
      --accent:#65a9f5; --accent-soft:#1d2c3d;
      --keep:#4fc99a; --keep-soft:#16302a;
      --drop:#e79465; --drop-soft:#33231a;
      --arrow:#65a9f5;
      --console-bg:#0d1117; --console-fg:#e6edf3;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--fg);padding:14px;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  .app{max-width:1020px;margin:0 auto}

  .head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .head h1{font-size:17px;margin:0;font-weight:600}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{
    font:inherit;font-size:13px;padding:6px 12px;cursor:pointer;
    background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;
  }
  .tabs button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}

  .main{display:grid;grid-template-columns:minmax(300px,1.05fr) minmax(300px,1fr);gap:14px;align-items:start}
  @media (max-width:820px){ .main{grid-template-columns:1fr} }

  .panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
  .panel h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    margin:0;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600;
  }

  pre.code{margin:0;padding:10px 0;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto;min-height:236px}
  .ln{display:flex;padding:0 12px;white-space:pre;border-left:3px solid transparent}
  .ln .num{color:var(--muted);opacity:.55;width:2.1em;text-align:right;margin-right:14px;user-select:none;flex:none}
  .ln.active{background:var(--hl);border-left-color:var(--hl-border)}
  .ln.gone{opacity:.32;text-decoration:line-through}

  .side{padding:12px;min-height:236px}

  /* Datenfluss */
  .stage{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:7px 10px;margin-bottom:6px}
  .stage.off{opacity:.4}
  .stage.hot{border-color:var(--accent);background:var(--accent-soft)}
  .stage .t{font:10.5px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:3px}
  .stage .v{font:12.5px ui-monospace,monospace}
  .stage .item{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:2px 3px 2px 0;font:11.5px ui-monospace,monospace}
  .stage .item.keep{border-color:var(--keep);background:var(--keep-soft);color:var(--keep)}
  .stage .item.drop{border-color:var(--drop);background:var(--drop-soft);color:var(--drop);text-decoration:line-through}
  .flowarrow{text-align:center;color:var(--arrow);font-size:13px;line-height:1;margin:1px 0 3px}
  .flowarrow span{font:10.5px ui-monospace,monospace;color:var(--muted);margin-left:6px}

  /* Pruefliste */
  .check{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;margin-bottom:7px}
  .check.off{opacity:.4}
  .check .mark{font-weight:700;font-size:14px;line-height:1.3;flex:none;width:1.2em;text-align:center}
  .check.ok .mark{color:var(--keep)}
  .check.no .mark{color:var(--drop)}
  .check.no{border-color:var(--drop)}
  .check.ok{border-color:var(--keep)}
  .check .txt{font-size:12.5px}
  .check .txt b{display:block;margin-bottom:1px}
  .check .txt span{color:var(--muted)}

  .console{
    background:var(--console-bg);color:var(--console-fg);border-radius:6px;
    font:12.5px/1.6 ui-monospace,monospace;padding:8px 11px;margin-top:10px;min-height:34px;white-space:pre-wrap;
  }
  .console:empty::before{content:"(noch keine Ausgabe)";opacity:.45}
  .stamp{font-size:11px;color:var(--muted);margin-top:6px;text-align:right}

  .caption{margin-top:14px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:14px}
  .caption b{color:var(--accent)}
  .controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .controls button{font:inherit;font-size:13.5px;font-weight:600;padding:8px 16px;cursor:pointer;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
  .controls button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .controls button:disabled{opacity:.4;cursor:default}
  #next{background:var(--accent);color:#fff;border-color:var(--accent)}
  #next:hover:not(:disabled){opacity:.9;color:#fff}
  .counter{font-size:12.5px;color:var(--muted);margin-left:auto}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <h1>Von der Schleife zur Pipeline</h1>
    <div class="tabs">
      <button data-ex="0" class="active">1 · Schritt für Schritt umbauen</button>
      <button data-ex="1">2 · Wann die Schleife bleibt</button>
    </div>
  </div>

  <div class="main">
    <div class="panel">
      <h2 id="codetitle">Code</h2>
      <pre class="code" id="code"></pre>
    </div>
    <div class="panel">
      <h2 id="sidetitle">Datenfluss</h2>
      <div class="side">
        <div id="viz"></div>
        <div class="console" id="console"></div>
        <div class="stamp" id="stamp"></div>
      </div>
    </div>
  </div>

  <div class="caption" id="caption"></div>

  <div class="controls">
    <button id="prev">◀ Zurück</button>
    <button id="next">Weiter ▶</button>
    <button id="reset">↺ Neu</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="hint">Tipp: Achten Sie auf die Konsole – sie zeigt bei jedem Schritt dasselbe Ergebnis. Genau das macht den Umbau zu einem Refactoring.</div>

</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     Gemeinsame Daten (identisch mit LU07d im Wiki)

       verkaeufe = [
         {"artikel": "Maus",     "kategorie": "Zubehoer", "menge": 3, "preis": 25.0},
         {"artikel": "Tastatur", "kategorie": "Zubehoer", "menge": 1, "preis": 80.0},
         {"artikel": "Laptop",   "kategorie": "Geraet",   "menge": 2, "preis": 1200.0},
         {"artikel": "USB-Hub",  "kategorie": "Zubehoer", "menge": 5, "preis": 12.0},
         {"artikel": "Monitor",  "kategorie": "Geraet",   "menge": 1, "preis": 210.0},
       ]

     Alle gezeigten Ausgaben gegen Python 3.12 geprueft.
     ============================================================ */

  var ALLE = [
    { n: "Maus",     zub: true  },
    { n: "Tastatur", zub: true  },
    { n: "Laptop",   zub: false },
    { n: "USB-Hub",  zub: true  },
    { n: "Monitor",  zub: false }
  ];
  var OUT = "215.0";

  function stageDaten(markiert){
    var items = ALLE.map(function(e){
      var cls = !markiert ? "" : (e.zub ? " keep" : " drop");
      return '<span class="item' + cls + '">' + e.n + '</span>';
    }).join("");
    return { t: "5 Einträge", body: items };
  }
  var STAGE_GEFILTERT = { t: "gefiltert → 3 Einträge",
    body: '<span class="item keep">Maus</span><span class="item keep">Tastatur</span><span class="item keep">USB-Hub</span>' };
  var STAGE_WERTE = { t: "umgeformt → 3 Werte",
    body: '<span class="item">75.0</span><span class="item">80.0</span><span class="item">60.0</span>' };
  var STAGE_SUMME = { t: "zusammengefasst", body: '<span class="v"><b>215.0</b></span>' };

  /* ============================================================
     Tab 1 – der Umbau in fünf Schritten
     ============================================================ */

  var CODE_0 = [
    "def umsatz_zubehoer(daten):",
    "    total = 0.0",
    "    for eintrag in daten:",
    "        if eintrag['kategorie'] == 'Zubehoer':",
    "            total += eintrag['menge'] * eintrag['preis']",
    "    return round(total, 2)",
    "",
    "print(umsatz_zubehoer(verkaeufe))"
  ];

  var CODE_2 = [
    "def ist_zubehoer(eintrag):",
    "    return eintrag['kategorie'] == 'Zubehoer'",
    "",
    "def umsatz_zubehoer(daten):",
    "    total = 0.0",
    "    for eintrag in daten:",
    "        if ist_zubehoer(eintrag):",
    "            total += eintrag['menge'] * eintrag['preis']",
    "    return round(total, 2)",
    "",
    "print(umsatz_zubehoer(verkaeufe))"
  ];

  var CODE_3 = [
    "def ist_zubehoer(eintrag):",
    "    return eintrag['kategorie'] == 'Zubehoer'",
    "",
    "def zeilenumsatz(eintrag):",
    "    return eintrag['menge'] * eintrag['preis']",
    "",
    "def umsatz_zubehoer(daten):",
    "    total = 0.0",
    "    for eintrag in daten:",
    "        if ist_zubehoer(eintrag):",
    "            total += zeilenumsatz(eintrag)",
    "    return round(total, 2)",
    "",
    "print(umsatz_zubehoer(verkaeufe))"
  ];

  var CODE_4 = [
    "def ist_zubehoer(eintrag):",
    "    return eintrag['kategorie'] == 'Zubehoer'",
    "",
    "def zeilenumsatz(eintrag):",
    "    return eintrag['menge'] * eintrag['preis']",
    "",
    "def umsatz_zubehoer(daten):",
    "    return round(sum(zeilenumsatz(e)",
    "                     for e in daten if ist_zubehoer(e)), 2)",
    "",
    "print(umsatz_zubehoer(verkaeufe))"
  ];

  var CODE_5 = [
    "from functools import reduce",
    "",
    "def ist_zubehoer(eintrag):",
    "    return eintrag['kategorie'] == 'Zubehoer'",
    "",
    "def zeilenumsatz(eintrag):",
    "    return eintrag['menge'] * eintrag['preis']",
    "",
    "def umsatz_zubehoer(daten):",
    "    return round(reduce(lambda a, e: a + zeilenumsatz(e),",
    "                        filter(ist_zubehoer, daten), 0.0), 2)",
    "",
    "print(umsatz_zubehoer(verkaeufe))"
  ];

  var STEPS_A = [
    {
      code: CODE_0, hl: [],
      flow: [ stageDaten(false), { t: "eine Schleife tut alles", body: '<span class="v">filtern · umformen · aufsummieren</span>', hot: true }, STAGE_SUMME ],
      out: OUT,
      cap: "<b>Die Ausgangslage.</b> Eine Schleife, drei Aufgaben gleichzeitig. Das Ergebnis stimmt – aber der Code sagt, <i>wie</i> gerechnet wird, nicht <i>was</i> herauskommen soll."
    },
    {
      code: CODE_0, hl: [4, 5],
      flow: [ stageDaten(true), STAGE_GEFILTERT, STAGE_WERTE, STAGE_SUMME ],
      out: OUT,
      cap: "Erst die drei Aufgaben auseinanderhalten: Zeile 4 <b>filtert</b>, Zeile 5 <b>formt um</b> und <b>summiert</b> in einem Zug. Rechts sehen Sie, was dabei tatsächlich passiert – 5 Einträge, davon 3 relevant."
    },
    {
      code: CODE_2, hl: [1, 2, 7],
      flow: [ stageDaten(true), Object.assign({ hot: true }, STAGE_GEFILTERT), STAGE_WERTE, STAGE_SUMME ],
      out: OUT,
      cap: "<b>Extract Function.</b> Die Bedingung bekommt einen Namen. Aus <code>eintrag['kategorie'] == 'Zubehoer'</code> wird <code>ist_zubehoer(eintrag)</code> – lesbar und ab jetzt an anderen Stellen wiederverwendbar."
    },
    {
      code: CODE_3, hl: [4, 5, 11],
      flow: [ stageDaten(true), STAGE_GEFILTERT, Object.assign({ hot: true }, STAGE_WERTE), STAGE_SUMME ],
      out: OUT,
      cap: "Dasselbe mit der Rechnung: <code>zeilenumsatz</code>. Jetzt haben alle drei Aufgaben einen Namen – und die Schleife enthält nur noch Verkabelung."
    },
    {
      code: CODE_4, hl: [8, 9],
      flow: [ stageDaten(true), STAGE_GEFILTERT, STAGE_WERTE, Object.assign({ hot: true }, STAGE_SUMME) ],
      out: OUT,
      cap: "<b>Replace Loop with Pipeline.</b> Zähler, Schleife und <code>+=</code> verschwinden. Übrig bleibt genau das, was rechts steht: filtern, umformen, zusammenfassen. <b>Das Ergebnis ist unverändert 215.0.</b>"
    },
    {
      code: CODE_5, hl: [10, 11],
      flow: [ stageDaten(true), STAGE_GEFILTERT, STAGE_WERTE, STAGE_SUMME ],
      out: OUT,
      cap: "Dieselbe Logik mit <code>filter</code> und <code>reduce</code>. Auch das ergibt 215.0 – zeigt die funktionalen Bausteine aus LU04 explizit, ist aber in Python <u>weniger</u> lesbar als die Fassung davor."
    },
    {
      code: CODE_4, hl: [],
      flow: [ stageDaten(true), STAGE_GEFILTERT, STAGE_WERTE, STAGE_SUMME ],
      out: OUT,
      cap: "<b>Fazit.</b> Fünf Umbauschritte, fünfmal dasselbe Ergebnis – das ist die Definition von Refactoring. Für den Alltag ist diese Fassung die richtige: <code>sum(...)</code> mit Comprehension. <code>ist_zubehoer</code> und <code>zeilenumsatz</code> sind der eigentliche Gewinn: aus einer Auswertung sind Bausteine geworden."
    }
  ];

  /* ============================================================
     Tab 2 – wann die Schleife bleibt
     ============================================================ */

  var CODE_B0 = [
    "gefunden = None",
    "for e in eintraege:",
    "    protokollieren(e)",
    "    if e['punkte'] > 80:",
    "        gefunden = e['name']",
    "        break",
    "",
    "print(gefunden)"
  ];

  var CODE_B4 = [
    "gefunden = next(",
    "    (e['name'] for e in eintraege if e['punkte'] > 80),",
    "    None",
    ")",
    "",
    "print(gefunden)"
  ];

  function checks(a, b, c){
    var texte = [
      ["Nur filtern, umformen oder zusammenfassen?", "Sonst passt keine Comprehension."],
      ["Ohne Seiteneffekt?", "Eine Comprehension nur wegen <code>print</code> oder Logging ist Missbrauch."],
      ["Ohne vorzeitigen Abbruch?", "<code>break</code> hat in einer Comprehension keine Entsprechung."]
    ];
    var zustaende = [a, b, c];
    var h = "";
    for (var i = 0; i < 3; i++){
      var z = zustaende[i];
      var cls = z === null ? "off" : (z ? "ok" : "no");
      var mark = z === null ? "?" : (z ? "✓" : "✗");
      h += '<div class="check ' + cls + '"><span class="mark">' + mark + '</span>'
         + '<span class="txt"><b>' + texte[i][0] + '</b><span>' + texte[i][1] + '</span></span></div>';
    }
    return h;
  }

  var STEPS_B = [
    { code: CODE_B0, hl: [], checksHtml: checks(null, null, null), out: "suter",
      cap: "Nicht jede Schleife wird als Pipeline besser. Diese hier sucht den ersten Eintrag über 80 Punkten – und tut nebenbei noch etwas anderes." },

    { code: CODE_B0, hl: [3], checksHtml: checks(false, null, null), out: "suter",
      cap: "<code>protokollieren(e)</code> ist ein <b>Seiteneffekt</b>. Er muss für jeden Eintrag bis zum Treffer ausgeführt werden – das ist weder filtern noch umformen noch zusammenfassen." },

    { code: CODE_B0, hl: [3], checksHtml: checks(false, false, null), out: "suter",
      cap: "Damit fällt das zweite Kriterium. Eine Comprehension, die nur wegen ihres Seiteneffekts läuft, missbraucht die Sprache: Sie baut eine Liste auf, die niemand will." },

    { code: CODE_B0, hl: [6], checksHtml: checks(false, false, false), out: "suter",
      cap: "Und <code>break</code>: Die Schleife hört beim ersten Treffer auf. In einer Comprehension gibt es dafür keine Entsprechung – sie läuft immer bis zum Ende. <b>Drei von drei Kriterien verletzt: Die Schleife bleibt.</b>" },

    { code: CODE_B4, hl: [1, 2, 3], checksHtml: checks(true, true, true), out: "suter",
      cap: "<b>Anders, wenn das Protokollieren wegfällt.</b> Dann sind alle drei Kriterien erfüllt und <code>next()</code> ist sogar besser als die Schleife: Der Generator erzeugt die Werte einzeln und hört beim ersten Treffer von selbst auf. Der zweite Parameter <code>None</code> ist der Rückfallwert, wenn nichts passt." },

    { code: CODE_B4, hl: [], checksHtml: checks(true, true, true), out: "suter",
      cap: "<b>Merken Sie sich die drei Fragen.</b> Sie entscheiden schneller als jedes Gefühl, ob ein Umbau die Sache besser macht – und eine dreifach verschachtelte Comprehension ist kein funktionaler Fortschritt, sondern ein neuer Smell." }
  ];

  var EXAMPLES = [
    { steps: STEPS_A, mode: "flow",   sideTitle: "Datenfluss",  codeTitle: "Code" },
    { steps: STEPS_B, mode: "checks", sideTitle: "Prüfliste",   codeTitle: "Code" }
  ];

  /* ============================================================
     Rendering
     ============================================================ */
  var elCode = document.getElementById("code");
  var elViz = document.getElementById("viz");
  var elConsole = document.getElementById("console");
  var elStamp = document.getElementById("stamp");
  var elCaption = document.getElementById("caption");
  var elCounter = document.getElementById("counter");
  var elSideTitle = document.getElementById("sidetitle");
  var elCodeTitle = document.getElementById("codetitle");
  var btnPrev = document.getElementById("prev");
  var btnNext = document.getElementById("next");
  var btnReset = document.getElementById("reset");

  var exIndex = 0, stepIndex = 0;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function renderCode(step){
    var html = "";
    for (var i = 0; i < step.code.length; i++){
      var nr = i + 1;
      var aktiv = step.hl.indexOf(nr) > -1;
      html += '<div class="ln' + (aktiv ? " active" : "") + '">'
            + '<span class="num">' + nr + '</span>'
            + '<span>' + (esc(step.code[i]) || " ") + '</span></div>';
    }
    elCode.innerHTML = html;
  }

  function renderFlow(step){
    var h = "";
    for (var i = 0; i < step.flow.length; i++){
      var s = step.flow[i];
      if (i > 0) h += '<div class="flowarrow">↓</div>';
      h += '<div class="stage' + (s.hot ? " hot" : "") + '">'
         + '<span class="t">' + s.t + '</span>' + s.body + '</div>';
    }
    elViz.innerHTML = h;
  }

  function renderStep(){
    var ex = EXAMPLES[exIndex], step = ex.steps[stepIndex];

    renderCode(step);
    if (ex.mode === "flow") renderFlow(step);
    else elViz.innerHTML = step.checksHtml;

    elConsole.textContent = step.out;
    elStamp.textContent = "geprüft mit Python 3.12";
    elCaption.innerHTML = step.cap;
    elCounter.textContent = "Schritt " + stepIndex + " / " + (ex.steps.length - 1);
    btnPrev.disabled = stepIndex === 0;
    btnNext.disabled = stepIndex === ex.steps.length - 1;
  }

  function go(d){
    var max = EXAMPLES[exIndex].steps.length - 1;
    stepIndex = Math.min(max, Math.max(0, stepIndex + d));
    renderStep();
  }

  function switchExample(i){
    exIndex = i; stepIndex = 0;
    var tabs = document.querySelectorAll(".tabs button");
    for (var t = 0; t < tabs.length; t++) tabs[t].className = (t === i) ? "active" : "";
    elSideTitle.textContent = EXAMPLES[i].sideTitle;
    elCodeTitle.textContent = EXAMPLES[i].codeTitle;
    renderStep();
  }

  btnNext.addEventListener("click", function(){ go(1); });
  btnPrev.addEventListener("click", function(){ go(-1); });
  btnReset.addEventListener("click", function(){ stepIndex = 0; renderStep(); });

  var tabs = document.querySelectorAll(".tabs button");
  for (var t = 0; t < tabs.length; t++){
    (function(btn){
      btn.addEventListener("click", function(){ switchExample(parseInt(btn.getAttribute("data-ex"), 10)); });
    })(tabs[t]);
  }

  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight"){ go(1); e.preventDefault(); }
    if (e.key === "ArrowLeft"){ go(-1); e.preventDefault(); }
  });

  switchExample(0);
})();
</script>
</body>
</html>
